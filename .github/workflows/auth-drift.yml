# Does the LIVE project's auth config still match what this repo declares? Asked here, not on the
# board (#148).
#
# WHY IT IS NOT IN `checks`. The comparison reads the project's auth settings through the Supabase
# Management API, which needs an access token. The board has none, so the lane printed SKIPPED on
# every run and measured nothing, while the board's last line counted it. A check that can only
# ever skip on the board belongs where its credential can reach it. The diff LOGIC still runs on
# the board (`--selftest`, synthetic inputs, no credential); only the read of the live project
# moved.
#
# WHEN IT RUNS.
#   - every day at 11:41 UTC: drift happens in a dashboard, where no push is involved, so only a
#     schedule can notice it.
#   - on a push to main that touches the declaration or the tool.
#   - on demand.
# It does NOT run on pull requests or on branch pushes, because a secret is not handed to a fork's
# pull request and a check that is red for want of one would block every PR.
#
# IT IS RED UNTIL THE SECRET EXISTS, on purpose. Add `SUPABASE_ACCESS_TOKEN` under Settings ->
# Secrets and variables -> Actions: a fine-grained token scoped to this one project with Auth
# Config READ (the tool only ever issues GET; see tools/check-auth-config.mjs for why it never
# writes). Until then this fails with the reason instead of passing quietly, which is the bug it
# replaces.
name: auth-drift

on:
  push:
    branches: [main]
    paths:
      - "supabase/config.toml"
      - "tools/check-auth-config.mjs"
      - ".github/workflows/auth-drift.yml"
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # engine-strict=true in .npmrc applies to pnpm only; the tool uses Node built-ins and the
      # runner's python3 (tomllib), so no install step is needed -- just the repo's own Node.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: The diff logic, on synthetic inputs
        run: node tools/check-auth-config.mjs --selftest

      - name: Refuse to pass without the token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the live auth config cannot be compared. Add it as a repository secret (read-only, one project)."
            exit 1
          fi

      - name: Live auth config against [remotes.production]
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          out=$(node tools/check-auth-config.mjs)
          printf '%s\n' "$out"
          # The tool exits 0 on its loud-skip branches (API unreachable, never applied). Here
          # that is not a pass: nothing was compared.
          case "$out" in *SKIPPED:*) echo "::error::auth config drift skipped; nothing was compared"; exit 1 ;; esac
