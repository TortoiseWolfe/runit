# The checks container, enforced on every push rather than remembered.
#
# It runs the same image and the same script as `pnpm checks:docker` locally, so
# a green run here means exactly what a green run on a laptop means. That is the
# whole point of the container -- see CLAUDE.md.
name: checks

on:
  push:
    branches: ["**"]
    # Tester screenshots are committed here by tools/feedback-to-issues.mjs, one
    # commit per submission. Without this, every screenshot a tester sends burns a
    # full Docker run to re-check source it did not touch.
    paths-ignore:
      - "design/feedback/**"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image runs as uid 1000 so that locally, dist/ and
      # design/screenshots/ come back owned by the developer rather than root.
      # GitHub runners check out as uid 1001, so the bind-mounted workspace is
      # unwritable by the container and pnpm fails with EACCES before it can
      # write its first temp file. Align the two.
      - name: Align workspace ownership with the container user
        run: sudo chown -R 1000:1000 .

      - name: Build the check image
        run: docker compose build checks

      - name: Run every gate
        run: docker compose run --rm checks

      # The screenshot harness is the slowest gate and the one whose output is
      # worth looking at when it fails.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: design/screenshots/
          if-no-files-found: ignore
