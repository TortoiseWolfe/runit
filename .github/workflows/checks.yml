# The checks container, enforced on every push rather than remembered.
#
# It runs the same image and the same script as `pnpm checks:docker` locally, so
# a green run here means exactly what a green run on a laptop means. That is the
# whole point of the container -- see CLAUDE.md.
name: checks

on:
  push:
    branches: ["**"]
    # Tester screenshots are committed here by tools/feedback-to-issues.mjs, one
    # commit per submission. Without this, every screenshot a tester sends burns a
    # full Docker run to re-check source it did not touch.
    paths-ignore:
      - "design/feedback/**"
  pull_request:
  # ON DEMAND, because a gate you cannot run is a gate you cannot trust after an outage.
  # CI stopped entirely for four commits when the account's Actions allowance ran out (#55),
  # and there was no way to re-run anything without inventing a commit to push. The repo is
  # public now, so minutes are unmetered and this costs nothing to have.
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LANE E RUNS ON THE BOARD, AGAINST A DATABASE THIS JOB BUILDS, SO IT CANNOT SKIP.
      # It used to wait for a `SUPABASE_DB_URL` secret that was never added, so every board
      # ended "Every check that RAN passed -- 1 lane skipped" and the one lane that watches
      # row-level security behave measured nothing. `policies.yml` already proved the
      # credential-free way (a local Supabase stack, the committed migration rebuilt on it);
      # this does the same here so the board itself carries the answer, on every push, not
      # only when `supabase/**` changes.
      #
      # BEFORE THE chown BELOW, on purpose: the Supabase CLI writes `supabase/.temp/`, and once
      # the tree belongs to uid 1000 the runner's own user (1001) cannot.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Pin the Supabase CLI
        run: echo "SUPABASE_CLI=supabase@$(cat supabase/.cli-version)" >> "$GITHUB_ENV"

      # Same three containers as policies.yml: db, auth and storage own the schemas the
      # migration references.
      - name: Start a local Supabase
        run: |
          npx --yes "$SUPABASE_CLI" start \
            -x imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,realtime

      # `db reset` so the schema is a FROM-SCRATCH apply of the committed migration, which
      # fails loudly if the migration cannot build a database (see policies.yml).
      - name: Rebuild the database from the committed migration
        run: npx --yes "$SUPABASE_CLI" db reset

      # The port is asked for, never typed (config.toml moved it once and a hardcoded URL
      # broke a job). Loopback, which is what verify-policies.mjs needs to skip TLS -- and
      # why the checks container joins the host network in docker/compose.ci.yaml: from a
      # bridge network `127.0.0.1` is the container itself.
      - name: Resolve the local database URL
        run: |
          url=$(npx --yes "$SUPABASE_CLI" status -o json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["DB_URL"])')
          test -n "$url" || { echo "supabase status reported no DB_URL"; exit 1; }
          echo "::add-mask::$url"
          echo "LOCAL_DB_URL=$url" >> "$GITHUB_ENV"

      # The image runs as uid 1000 so that locally, dist/ and
      # design/screenshots/ come back owned by the developer rather than root.
      # GitHub runners check out as uid 1001, so the bind-mounted workspace is
      # unwritable by the container and pnpm fails with EACCES before it can
      # write its first temp file. Align the two.
      - name: Align workspace ownership with the container user
        run: sudo chown -R 1000:1000 .

      - name: Build the check image
        run: docker compose build checks

      # SUPABASE_DB_URL IS THE LOCAL STACK ABOVE, not a secret, so lane E runs for a fork's
      # pull request too and hands no database password to anything a stranger can trigger.
      # Drift between the migration and the LIVE project is a different question that only a
      # production URL answers; ask it by hand: SUPABASE_DB_URL=<url> pnpm verify:policies.
      - name: Run every gate
        run: docker compose -f compose.yaml -f docker/compose.ci.yaml run --rm checks
        env:
          SUPABASE_DB_URL: ${{ env.LOCAL_DB_URL }}
          # `vars`, NOT `secrets`, and that is the honest classification: both are
          # `EXPO_PUBLIC_` and are therefore compiled into every shipped bundle. Filing a
          # public value as a secret teaches everyone that the secret store holds things
          # that do not matter.
          #
          # Without them `audit:auth` skipped in CI and ran only on one laptop -- which is
          # the wrong place for the check that would have caught anonymous sign-in being
          # switched off in a dashboard.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # The screenshot harness is the slowest gate and the one whose output is
      # worth looking at when it fails.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: design/screenshots/
          if-no-files-found: ignore

      # THE BEST DIAGNOSTIC THIS REPO PRODUCES WAS BEING THROWN AWAY. `playwright.config.ts`
      # already sets `trace: 'retain-on-failure'` and `screenshot: 'only-on-failure'`, and
      # compose.yaml sets CI=1 so an HTML report is written too -- all of it inside the
      # container, and all of it discarded when the container was removed. A failed journey
      # produces a time-travelling DOM recording; without this it never left the machine.
      #
      # `playwright-report/` is self-contained: the html reporter copies attachments into
      # data/ and bundles the trace viewer, so it opens a failed journey on its own. The
      # standalone lanes write siblings under test-results/ (lane-b, lane-h) -- which is why
      # the journeys were given their own subtree, since `playwright test` wipes its
      # outputDir at the start of every run.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
