# LANE E, IN CI, WITH NO CREDENTIAL AT ALL.
#
# `supabase/verify-policies.sql` is the only check in this repo that can watch row-level
# security behave, and until 2026-09-06 it had never run to completion — because running it
# needed a production database password nobody had, so it skipped, and a skip and a pass are
# the same green. Three defects were hiding in that silence (FIDELITY note AT, #31).
#
# This job removes the reason rather than working around it. `supabase start` gives a real
# Postgres with the actual `auth`, `storage`, `anon` and `authenticated` machinery, the
# committed migration is applied to it, and the lane runs against loopback. Nothing here is
# secret, so this cannot skip for want of a credential — which is the property that matters,
# since a gate that can silently skip is the bug this whole issue is about.
#
# IT ALSO GUARDS SOMETHING NOTHING ELSE DOES: that the migration can BUILD A DATABASE. It
# could not, from aed8fb1 until 63c736c, and nothing noticed because nothing had ever applied
# it to an empty database — it worked in production only because the objects were already
# there. `psql -v ON_ERROR_STOP=1` is what makes that a gate rather than a hope.
#
# WHAT IT CANNOT SEE is drift between the committed migration and the live project. Only a
# run against production finds that, which is why `checks.yml` also passes a
# `SUPABASE_DB_URL` secret through when one exists. The two are complements, not substitutes.
name: policies

on:
  push:
    # Scoped deliberately. The policies, the functions and the grants this lane asserts all
    # live under supabase/, so a push that does not touch these paths cannot change what it
    # measures — and a job that runs on every unrelated commit is a job someone eventually
    # deletes for being slow.
    paths: &paths
      - "supabase/**"
      - "tools/verify-policies.mjs"
      - "tools/audit-sql-declare.mjs"
      - ".github/workflows/policies.yml"
  pull_request:
    paths: *paths
  # ON DEMAND, because a gate you cannot run is a gate you cannot trust after an outage.
  # CI stopped entirely for four commits when the account's Actions allowance ran out (#55),
  # and there was no way to re-run anything without inventing a commit to push. The repo is
  # public now, so minutes are unmetered and this costs nothing to have.
  workflow_dispatch:

jobs:
  lane-e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # engine-strict=true means a wrong Node FAILS the install rather than warning, so the
      # version has to come from .nvmrc rather than from whatever the runner ships.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # The static half, which needs nothing at all: a DECLARE block naming a variable twice
      # is 42601 at COMPILE time, so the file would not run one assertion. It is cheap and it
      # runs first, so the expensive half is not spent discovering something free would catch.
      - name: SQL declare audit
        run: pnpm audit:sql

      # PINNED, like @playwright/test and Node are. Three containers rather than twelve:
      # db, auth and storage are what own the schemas the migration references.
      - name: Start a local Supabase
        run: |
          npx --yes supabase@2.116.0 start \
            -x imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,realtime

      # `db reset` RATHER THAN psql, and the reason is #48's own consequence. The rename
      # off `init` made the CLI START APPLYING the migration -- which is what it was for --
      # so `supabase start` above now builds the schema, and the explicit psql apply that
      # followed it hit `relation "events" already exists` and failed the job. The fix that
      # closed a silent no-op created a double apply in the same change.
      #
      # This keeps the property the psql step was there for: a FROM-SCRATCH apply that fails
      # loudly. Mutation-checked -- an unappliable statement makes `db reset` exit 1 and name
      # the statement number and SQLSTATE, which is a better diagnostic than ON_ERROR_STOP
      # gave. It also rebuilds the DATABASE rather than dropping a schema, so Supabase's
      # default privileges survive and the client grants are real.
      - name: Rebuild the database from the committed migration
        run: npx --yes supabase@2.116.0 db reset

      # THE PORT IS NOT HARDCODED, and it was, and that broke this job. `supabase/config.toml`
      # moved runit's local stack to 5442x so it can run beside another project's on this
      # machine — a purely local convenience that silently invalidated two hardcoded
      # `127.0.0.1:54322` lines here, and the next push failed with ECONNREFUSED on a step
      # that had nothing to do with the change. The CLI knows where it bound; ask it.
      - name: Resolve the local database URL
        run: |
          # 2>/dev/null because the CLI writes advisories and a "Stopped services" line to
          # stderr — harmless in a terminal, fatal to a JSON parse if it ever lands on stdout.
          url=$(npx --yes supabase@2.116.0 status -o json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["DB_URL"])')
          test -n "$url" || { echo "supabase status reported no DB_URL"; exit 1; }
          echo "SUPABASE_DB_URL=$url" >> "$GITHUB_ENV"
          echo "resolved: ${url/postgres:postgres@/postgres:***@}"

      # SUPABASE_DB_URL comes from the resolve step above. Loopback, so no TLS —
      # verify-policies.mjs matches the HOST for that, never a flag, so this cannot
      # loosen a remote connection.
      - name: Schema fingerprint
        run: pnpm schema:check

      - name: Lane E
        run: pnpm verify:policies

      - name: What the database ended up with
        if: failure()
        run: |
          db=$(docker ps --filter name=supabase_db --format '{{.Names}}' | head -1)
          docker exec "$db" psql -U postgres -c "\dt public.*" || true
          docker exec "$db" psql -U postgres -c "select count(*) from pg_policies where schemaname in ('public','storage')" || true
          npx --yes supabase@2.116.0 status || true
