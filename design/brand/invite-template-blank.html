<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RunIt invitation template</title></head>
<!--
  ===========================================================================
  RunIt invitation - a template for YOUR events.

  Make the event in the RunIt app first. It gives you a six-character code.
  Then replace every [BRACKETED] field below and send this to your guests.

      [EVENT NAME]   what you are calling it
      [WHEN]         e.g. Saturday, October 3 - from 4pm
      [WHERE]        e.g. The Barn at Willow Creek
      [YOUR LINE]    anything you want to say, or delete that row
      [CODE]         the code the app gave you - APPEARS FOUR TIMES
      [YOUR NAME]    who it is from

  [CODE] appears FOUR times: the big type, the button's link, and the text
  link twice - once in its address and once in the words you can see. Replace
  every one of them or guests land on the wrong event.

  Do not paste an app download link in here. The link points at
  runit-app.pages.dev, where install instructions live and stay current.
  A download link points at one build and goes stale.

  Tables and inline styles on purpose - that is what survives Gmail,
  Apple Mail and Outlook intact.
  ===========================================================================
-->
<body style="margin:0;padding:0;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#EDEAE6" style="background:#EDEAE6;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px;width:100%;background:#1A1A2E;border-radius:16px;">
<tr><td style="padding:34px 32px 8px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#9AA3B2;font-size:11px;letter-spacing:2px;text-transform:uppercase;">You&rsquo;re invited to</td></tr>
<tr><td style="padding:0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#F5F0EB;font-size:30px;line-height:1.15;font-weight:700;">[EVENT NAME]</td></tr>
<tr><td style="padding:12px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#E8D4B8;font-size:16px;">[WHEN] &middot; [WHERE]</td></tr>
<tr><td style="padding:18px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#C9D1DE;font-size:15px;line-height:1.55;">[YOUR LINE HERE - or delete this row entirely]</td></tr>
<tr><td style="padding:26px 32px 0 32px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#12162A;border-radius:12px;">
  <tr><td style="padding:18px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#9AA3B2;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;">Join with this code</td></tr>
  <tr><td style="padding:0 20px 6px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#F2B84B;font-size:30px;font-weight:700;letter-spacing:6px;">[CODE]</td></tr>
  <tr><td style="padding:0 20px 18px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#9AA3B2;font-size:13px;line-height:1.5;">Pick any nickname. No account, no phone number.</td></tr>
  </table>
</td></tr>
<tr><td align="center" style="padding:24px 32px 4px 32px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
  <td bgcolor="#38BDF8" style="border-radius:999px;"><a href="https://runit-app.pages.dev/i/[CODE]" style="display:inline-block;padding:14px 30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0B1020;font-size:16px;font-weight:700;text-decoration:none;">Get the app &amp; join</a></td>
  </tr></table>
</td></tr>
<tr><td align="center" style="padding:12px 32px 30px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6E7793;font-size:12px;line-height:1.5;">
  <a href="https://runit-app.pages.dev/i/[CODE]" style="color:#6E7793;text-decoration:underline;">runit-app.pages.dev/i/[CODE]</a>
</td></tr>
<tr><td align="center" style="padding:0 32px 30px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#6E7793;font-size:12px;">
  Shared photos, song requests and updates &mdash; on <span style="color:#E8D4B8;font-weight:700;">Run<span style="color:#F2B84B;">I</span>t</span>, from [YOUR NAME]
</td></tr>
</table>
</td></tr></table>
</body>
</html>
