<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>RunIt animated logo preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #080912;
        color: #fffdf5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 40%, #20243b 0, #0e101c 48%, #05060b 100%);
      }

      object {
        display: block;
        width: min(82vmin, 760px);
        aspect-ratio: 1;
        box-shadow: 0 28px 72px rgb(0 0 0 / 55%);
      }

      .controls {
        position: fixed;
        right: 20px;
        bottom: 20px;
        left: 20px;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      button,
      output {
        min-height: 40px;
        border: 1px solid rgb(255 255 255 / 16%);
        background: rgb(8 9 18 / 82%);
        color: inherit;
        font: inherit;
        letter-spacing: 0;
        box-shadow: 0 8px 24px rgb(0 0 0 / 28%);
      }

      button {
        padding: 0 16px;
        cursor: pointer;
      }

      button:hover {
        border-color: rgb(242 184 75 / 65%);
      }

      button:focus-visible {
        outline: 2px solid #f2b84b;
        outline-offset: 2px;
      }

      output {
        min-width: 230px;
        padding: 9px 14px;
        color: #e8d4b8;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 560px) {
        .controls {
          flex-wrap: wrap;
        }

        output {
          order: -1;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <object id="logo" data="./runit-logo.svg?motion=search-settle-v1" type="image/svg+xml" aria-label="Animated RunIt logo"></object>
    </main>

    <div class="controls">
      <button id="toggle" type="button">Pause</button>
      <button id="restart" type="button">Restart</button>
      <output id="status" aria-live="polite">Loading SVG timeline...</output>
    </div>

    <script>
      const logo = document.querySelector('#logo');
      const toggle = document.querySelector('#toggle');
      const restart = document.querySelector('#restart');
      const status = document.querySelector('#status');

      logo.addEventListener('load', () => {
        const svgDocument = logo.contentDocument;
        const svg = svgDocument?.documentElement;
        const beam = svgDocument?.querySelector('g.motion');

        if (!svg || typeof svg.getCurrentTime !== 'function' || !beam) {
          status.value = 'SVG timeline unavailable';
          toggle.disabled = true;
          restart.disabled = true;
          return;
        }

        const override = svgDocument.createElementNS('http://www.w3.org/2000/svg', 'style');
        override.textContent = '.motion{display:inline!important}.motion-static{display:none!important}';
        svg.prepend(override);

        let paused = false;

        const renderStatus = () => {
          const time = svg.getCurrentTime();
          const animatedTransform = beam.transform.animVal;
          const angle = animatedTransform.numberOfItems
            ? animatedTransform.getItem(0).angle
            : 0;
          const phase = paused ? 'Paused' : time < 6 ? 'Sweeping' : 'Settled';
          status.value = `${phase} | ${time.toFixed(1)}s | beam ${angle.toFixed(1)}deg`;
          requestAnimationFrame(renderStatus);
        };

        toggle.addEventListener('click', () => {
          paused = !paused;
          if (paused) {
            svg.pauseAnimations();
          } else {
            svg.unpauseAnimations();
          }
          toggle.textContent = paused ? 'Play' : 'Pause';
        });

        restart.addEventListener('click', () => {
          svg.setCurrentTime(0);
          if (paused) {
            paused = false;
            svg.unpauseAnimations();
            toggle.textContent = 'Pause';
          }
        });

        renderStatus();
      });
    </script>
  </body>
</html>
