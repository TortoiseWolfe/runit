<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">RunIt run of light logo</title>
  <desc id="description">A luminous RunIt wordmark on a deep navy field. The capital I is a spotlight: a squared amber stem standing on the baseline, wearing a glowing lens where a capital has no business carrying a dot.</desc>

  <style>
    .motion-static { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .motion-static { display: inline; }
    }
  </style>

  <defs>
    <linearGradient id="background" x1="90" y1="40" x2="940" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172A45"/>
      <stop offset=".38" stop-color="#11162A"/>
      <stop offset=".72" stop-color="#171126"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>

    <radialGradient id="coolAtmosphere" cx="0" cy="0" r="1" gradientTransform="translate(150 90) rotate(42) scale(700 590)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity=".11"/>
      <stop offset=".5" stop-color="#233E68" stop-opacity=".04"/>
      <stop offset="1" stop-color="#11162A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="warmAtmosphere" cx="0" cy="0" r="1" gradientTransform="translate(820 310) rotate(126) scale(520 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2B84B" stop-opacity=".17"/>
      <stop offset=".48" stop-color="#B94E3E" stop-opacity=".055"/>
      <stop offset="1" stop-color="#080912" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ivoryFace" x1="0" y1="0" x2="0" y2="1490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C5A171"/>
      <stop offset=".24" stop-color="#E8D4B8"/>
      <stop offset=".58" stop-color="#FFF3D2"/>
      <stop offset="1" stop-color="#FFFDF5"/>
    </linearGradient>

    <linearGradient id="spotlightMetal" x1="780" y1="350" x2="820" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3A5"/>
      <stop offset=".28" stop-color="#FFD15D"/>
      <stop offset=".7" stop-color="#F39A38"/>
      <stop offset="1" stop-color="#FF5E68"/>
    </linearGradient>

    <radialGradient id="lens" cx=".32" cy=".25" r=".78">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".16" stop-color="#FFFCE2"/>
      <stop offset=".43" stop-color="#FFE271"/>
      <stop offset=".76" stop-color="#F5A735"/>
      <stop offset="1" stop-color="#EF7544"/>
    </radialGradient>

    <linearGradient id="beam" x1="826" y1="300" x2="80" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9CE" stop-opacity=".9"/>
      <stop offset=".11" stop-color="#FFD363" stop-opacity=".72"/>
      <stop offset=".38" stop-color="#F5AE3C" stop-opacity=".42"/>
      <stop offset=".72" stop-color="#EE8738" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FF5E68" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamOnType" x1="820" y1="320" x2="110" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8C8" stop-opacity=".86"/>
      <stop offset=".24" stop-color="#FFD260" stop-opacity=".62"/>
      <stop offset=".7" stop-color="#F3A13B" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F3A13B" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop stop-color="#FFF5B5" stop-opacity=".9"/>
      <stop offset=".28" stop-color="#FFD05A" stop-opacity=".7"/>
      <stop offset=".7" stop-color="#F09A38" stop-opacity=".24"/>
      <stop offset="1" stop-color="#F09A38" stop-opacity="0"/>
    </radialGradient>

    <filter id="wordDepth" x="-25%" y="-35%" width="160%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="shadowBlur"/>
      <feOffset in="shadowBlur" dy="18" result="shadowOffset"/>
      <feFlood flood-color="#01030A" flood-opacity=".82" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOffset" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="warmBlur"/>
      <feFlood flood-color="#F2B84B" flood-opacity=".18" result="warmColor"/>
      <feComposite in="warmColor" in2="warmBlur" operator="in" result="warmEdge"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="warmEdge"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="beamSoft" x="-18%" y="-35%" width="150%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

    <filter id="beamFaceSoft" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="poolSoft" x="-20%" y="-250%" width="140%" height="600%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13"/>
    </filter>

    <filter id="lensGlow" x="-170%" y="-170%" width="440%" height="440%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="34" result="wideGlow"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="tightGlow"/>
      <feMerge>
        <feMergeNode in="wideGlow"/>
        <feMergeNode in="tightGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="runLetters" transform="translate(45 650) scale(.19 -.19)">
      <path d="M122 0V1490H711Q880 1490 1001 1430Q1122 1370 1186.5 1261Q1251 1152 1251 1003Q1251 855 1184 748Q1117 641 993 583.5Q869 526 698 526H304V773H676Q763 773 822.5 800.5Q882 828 913 879.5Q944 931 944 1003Q944 1076 913 1128Q882 1180 822 1208Q762 1236 675 1236H428V0ZM959 0L609 675H936L1293 0Z"/>
      <path transform="translate(1338)" d="M492 -19Q378 -19 293 30.5Q208 80 161.5 174Q115 268 115 400V1084H412V453Q412 348 464 291Q516 234 610 234Q672 234 719.5 260.5Q767 287 794 339.5Q821 392 821 470V1084H1118V0H831L829 277H865Q817 136 725.5 58.5Q634 -19 492 -19Z"/>
      <path transform="translate(2571)" d="M412 614V0H115V1084H402L404 807H368Q415 947 506.5 1024.5Q598 1102 741 1102Q855 1102 940 1052.5Q1025 1003 1071.5 909.5Q1118 816 1118 683V0H821V630Q821 735 769 792Q717 849 623 849Q561 849 513.5 823Q466 797 439 744.5Q412 692 412 614Z"/>
    </g>

    <path id="tLetter" transform="translate(830 650) scale(.19 -.19)" d="M699 1084V853H19V1084ZM189 1362H485V327Q485 273 508 250.5Q531 228 588 228Q610 228 642.5 230Q675 232 693 233L712 5Q675 -2 626.5 -4.5Q578 -7 531 -7Q359 -7 274 67Q189 141 189 289Z"/>

    <path id="beamShape" d="M790 286C616 325 337 415 77 529L225 740C431 612 648 520 834 456C835 404 824 351 807 330Z"/>

    <clipPath id="runClip" clipPathUnits="userSpaceOnUse">
      <use href="#runLetters"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#coolAtmosphere)"/>
  <rect width="1024" height="1024" fill="url(#warmAtmosphere)"/>

  <g class="motion">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-15 787 301;13 787 301;-10 787 301;7 787 301;-4 787 301;2 787 301;-.6 787 301;0 787 301;0 787 301"
      keyTimes="0;.18;.36;.53;.68;.80;.89;.94;1"
      keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.22 .72 .18 1;0 0 1 1"
      calcMode="spline"
      dur="6.4s"
      repeatCount="1"
      fill="freeze"
      begin="0s"
    />
    <animate
      attributeName="opacity"
      values=".55;.78;.66;.82;.7;.86;.9;1;1"
      keyTimes="0;.18;.36;.53;.68;.80;.89;.94;1"
      keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.22 .72 .18 1;0 0 1 1"
      calcMode="spline"
      dur="6.4s"
      repeatCount="1"
      fill="freeze"
      begin="0s"
    />
    <use href="#beamShape" fill="url(#beam)" opacity=".5" filter="url(#beamSoft)"/>
    <use href="#beamShape" fill="url(#beam)" opacity=".56"/>
  </g>
  <g class="motion-static">
    <use href="#beamShape" fill="url(#beam)" opacity=".5" filter="url(#beamSoft)"/>
    <use href="#beamShape" fill="url(#beam)" opacity=".56"/>
  </g>

  <g class="motion">
    <ellipse cx="438" cy="698" rx="336" ry="31" fill="url(#pool)" opacity=".72" filter="url(#poolSoft)">
      <animate attributeName="rx" values="220;280;225;292;230;305;240;318;250;328;270;340;300;365;336" keyTimes="0;.10;.18;.28;.36;.46;.53;.62;.68;.76;.80;.87;.89;.94;1" dur="6.4s" repeatCount="1" fill="freeze" begin="0s"/>
      <animate attributeName="ry" values="20;26;20;27;21;28;22;29;23;30;24;32;27;38;31" keyTimes="0;.10;.18;.28;.36;.46;.53;.62;.68;.76;.80;.87;.89;.94;1" dur="6.4s" repeatCount="1" fill="freeze" begin="0s"/>
      <animate attributeName="opacity" values=".06;.30;.09;.36;.11;.43;.13;.50;.17;.58;.23;.66;.38;.88;.72" keyTimes="0;.10;.18;.28;.36;.46;.53;.62;.68;.76;.80;.87;.89;.94;1" dur="6.4s" repeatCount="1" fill="freeze" begin="0s"/>
    </ellipse>
    <ellipse cx="438" cy="694" rx="236" ry="11" fill="url(#pool)" opacity=".58">
      <animate attributeName="rx" values="154;196;158;204;161;214;168;223;175;230;189;238;210;256;236" keyTimes="0;.10;.18;.28;.36;.46;.53;.62;.68;.76;.80;.87;.89;.94;1" dur="6.4s" repeatCount="1" fill="freeze" begin="0s"/>
      <animate attributeName="ry" values="7;10;7;10;8;10;8;11;9;11;9;12;10;14;11" keyTimes="0;.10;.18;.28;.36;.46;.53;.62;.68;.76;.80;.87;.89;.94;1" dur="6.4s" repeatCount="1" fill="freeze" begin="0s"/>
      <animate attributeName="opacity" values=".04;.22;.07;.27;.08;.32;.10;.38;.13;.44;.17;.50;.29;.72;.58" keyTimes="0;.10;.18;.28;.36;.46;.53;.62;.68;.76;.80;.87;.89;.94;1" dur="6.4s" repeatCount="1" fill="freeze" begin="0s"/>
    </ellipse>
  </g>
  <g class="motion-static">
    <ellipse cx="438" cy="698" rx="336" ry="31" fill="url(#pool)" opacity=".72" filter="url(#poolSoft)"/>
    <ellipse cx="438" cy="694" rx="236" ry="11" fill="url(#pool)" opacity=".58"/>
  </g>

  <use href="#runLetters" fill="url(#ivoryFace)" filter="url(#wordDepth)"/>
  <g class="motion">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-15 787 301;13 787 301;-10 787 301;7 787 301;-4 787 301;2 787 301;-.6 787 301;0 787 301;0 787 301"
      keyTimes="0;.18;.36;.53;.68;.80;.89;.94;1"
      keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.22 .72 .18 1;0 0 1 1"
      calcMode="spline"
      dur="6.4s"
      repeatCount="1"
      fill="freeze"
      begin="0s"
    />
    <animate
      attributeName="opacity"
      values=".55;.78;.66;.82;.7;.86;.9;1;1"
      keyTimes="0;.18;.36;.53;.68;.80;.89;.94;1"
      keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.22 .72 .18 1;0 0 1 1"
      calcMode="spline"
      dur="6.4s"
      repeatCount="1"
      fill="freeze"
      begin="0s"
    />
    <use href="#beamShape" fill="url(#beamOnType)" clip-path="url(#runClip)" opacity=".68" filter="url(#beamFaceSoft)"/>
  </g>
  <use class="motion-static" href="#beamShape" fill="url(#beamOnType)" clip-path="url(#runClip)" opacity=".68" filter="url(#beamFaceSoft)"/>

  <path d="M754 650V367H820V650Z" fill="url(#spotlightMetal)" filter="url(#wordDepth)"/>
  <use href="#tLetter" fill="url(#ivoryFace)" filter="url(#wordDepth)"/>

  <circle class="motion" cx="787" cy="301" r="43" fill="#F2B84B" opacity=".8" filter="url(#lensGlow)">
    <animate attributeName="r" values="40;42;41;43;42;45;46;52;43" keyTimes="0;.18;.36;.53;.68;.80;.89;.94;1" dur="6.4s" repeatCount="1" fill="freeze" begin="0s"/>
    <animate attributeName="opacity" values=".52;.62;.58;.66;.62;.72;.78;1;.8" keyTimes="0;.18;.36;.53;.68;.80;.89;.94;1" dur="6.4s" repeatCount="1" fill="freeze" begin="0s"/>
  </circle>
  <circle class="motion-static" cx="787" cy="301" r="43" fill="#F2B84B" opacity=".8" filter="url(#lensGlow)"/>
  <circle cx="787" cy="301" r="43" fill="url(#lens)"/>
  <circle cx="774" cy="288" r="11" fill="#FFFFFF" opacity=".76"/>
</svg>
